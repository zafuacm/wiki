[build]
  command = "pnpm build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "22"
  # 锁文件仍是 pnpm 8 的 v6 格式，避免新版 pnpm 在 frozen 模式下直接拒绝。
  PNPM_FLAGS = "--no-frozen-lockfile"
  # Netlify 后台还留着 MkDocs 时代的 PYTHON_VERSION=3.8；新版 noble 镜像用 mise
  # 安装 python@3.8.20 时会因缺少 GitHub attestation 直接失败。跳过该校验。
  MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
